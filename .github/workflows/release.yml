name: Release

# Pushing a version tag (v1.21.0) publishes that version: the checks run, the macOS installers are
# built for Apple Silicon and Intel, and a GitHub release is created with them and the CHANGELOG
# section as notes. The app finds it through the GitHub API and tells its users.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: The tag is the app version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($version)"
            exit 1
          fi
      - name: Release notes from the CHANGELOG
        run: npx tsx scripts/release-notes.ts "$GITHUB_REF_NAME" > release-notes.md
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Installers for Apple Silicon and Intel (not signed)
        run: npm run desktop:dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.dmg release/*.zip \
            --title "QA Dashboard ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            --verify-tag
